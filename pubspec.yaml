name: mikro_manager_pro
description: تطبيق إدارة وطباعة كروت الميكروتك - MikroManager Pro
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Local Database
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # HTTP / REST
  dio: ^5.6.0

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.1

  # Thermal Printing
  blue_thermal_printer: ^1.1.3
  esc_pos_utils_plus: ^2.0.4

  # Charts
  fl_chart: ^0.69.0

  # QR Code
  qr_flutter: ^4.1.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.4.2
  path: ^1.9.0
  path_provider: ^2.1.4
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.19.1
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/logos/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
